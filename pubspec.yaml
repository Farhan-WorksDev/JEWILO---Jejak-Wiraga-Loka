name: tari_app
description: "Aplikasi Klasifikasi Gerakan Tari Offline"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1
  camera: ^0.12.1
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.3
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  firebase_messaging: ^17.0.0
  google_sign_in: ^7.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/dance_detector.tflite
    - assets/models/label_map.json
    - assets/jewilo_logo.png
    - assets/jewilo_logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/jewilo_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F5F2FA"
  adaptive_icon_foreground: "assets/jewilo_logo.png"
  remove_alpha_ios: true